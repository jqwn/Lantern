name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check toolchain and architecture
        run: |
          test "$(uname -m)" = arm64
          swift --version
          xcodebuild -version
      - name: Unit tests
        run: sh test.sh --unit-only
      - name: Build DMG
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OPENSUBTITLES_API_KEY: ${{ github.event_name == 'push' && secrets.OPENSUBTITLES_API_KEY || '' }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            sh build-dmg.sh "${REF_NAME#v}"
          else
            sh build-dmg.sh
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lantern-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Lantern-macOS-arm64
          path: dist
      - name: Publish unnotarized prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check ./*.sha256)
          gh release create "$TAG" dist/*.dmg dist/*.sha256 \
            --verify-tag --prerelease --title "Lantern $TAG — preview" \
            --notes-file Resources/Install.txt
